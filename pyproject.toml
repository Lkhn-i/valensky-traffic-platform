[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-site"
version = "0.1.0"
description = "Chalkboard course platform for Valensky traffic training."
readme = "INDEX.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<3.3",
  "celery[redis]>=5.6,<5.7",
  "redis>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.11,<0.12",
  "mypy>=1.15,<1.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
files = ["apps", "config"]
exclude = ["migrations"]
